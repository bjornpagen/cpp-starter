# Toolchain-pinned CI. CI is part of the language implementation: the jobs
# below run the same pinned stack the repository is developed against
# (GCC 16.1 + CMake 4.2.1 + Ninja 1.13.2 for production graphs, Clang/LLVM 22
# for the lint graph) on Darwin arm64 and Linux arm64.
#
# Hashes checked 2026-08-12:
#   - cmake-4.2.1-linux-aarch64.tar.gz and cmake-4.2.1-macos-universal.tar.gz
#     from Kitware SHA-256.txt
#   - ninja-linux-aarch64.zip and ninja-mac.zip from the v1.13.2 GitHub release
#   - actions/checkout v5 pin retained from the previous workflow

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CMAKE_VERSION: 4.2.1
  NINJA_VERSION: 1.13.2

jobs:
  linux-gcc-release:
    runs-on: ubuntu-24.04-arm
    container: gcc:16.1.0-trixie
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-aarch64.tar.gz
      CMAKE_SHA256: 3e178207a2c42af4cd4883127f8800b6faf99f3f5187dccc68bfb2cc7808f5f7
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux-aarch64.zip
      NINJA_SHA256: fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake, Ninja, and smoke-test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip netcat-openbsd
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | sha256sum -c
          (cd /usr/local/bin && cmake -E tar xf /tmp/ninja.zip && chmod +x ninja)
          cmake --version
          ninja --version
          g++ --version
      - name: Configure
        run: cmake --preset release -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  linux-gcc-asan-ubsan:
    runs-on: ubuntu-24.04-arm
    container: gcc:16.1.0-trixie
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-aarch64.tar.gz
      CMAKE_SHA256: 3e178207a2c42af4cd4883127f8800b6faf99f3f5187dccc68bfb2cc7808f5f7
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux-aarch64.zip
      NINJA_SHA256: fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake, Ninja, and smoke-test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip netcat-openbsd
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | sha256sum -c
          (cd /usr/local/bin && cmake -E tar xf /tmp/ninja.zip && chmod +x ninja)
      - name: Configure
        run: cmake --preset asan-ubsan -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build --preset asan-ubsan
      - name: Test
        run: ctest --preset asan-ubsan

  linux-lint:
    runs-on: ubuntu-24.04-arm
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-aarch64.tar.gz
      CMAKE_SHA256: 3e178207a2c42af4cd4883127f8800b6faf99f3f5187dccc68bfb2cc7808f5f7
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux-aarch64.zip
      NINJA_SHA256: fd2cacc8050a7f12a16a2e48f9e06fca5c14fc4c2bee2babb67b58be17a607fc
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | sha256sum -c
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | sha256sum -c
          (cd /tmp && cmake -E tar xf /tmp/ninja.zip && chmod +x ninja && sudo mv ninja /usr/local/bin/)
      - name: Install LLVM 22 from apt.llvm.org (pinned suite)
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
          echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/apt-llvm-org.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 clang-tidy-22 clang-tools-22 libc++-22-dev libc++abi-22-dev
          /usr/lib/llvm-22/bin/clang++ --version
          /usr/lib/llvm-22/bin/clang-tidy --version
          /usr/lib/llvm-22/bin/clang-scan-deps --version
          test -f /usr/lib/llvm-22/lib/libc++.modules.json
      - name: Configure
        run: |
          cmake --preset lint \
            -DCMAKE_CXX_COMPILER=/usr/lib/llvm-22/bin/clang++ \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=/usr/lib/llvm-22/bin/clang-scan-deps \
            -DCMAKE_CXX_CLANG_TIDY='/usr/lib/llvm-22/bin/clang-tidy;--experimental-custom-checks' \
            -DCMAKE_CXX_STDLIB_MODULES_JSON=/usr/lib/llvm-22/lib/libc++.modules.json
      - name: Build
        run: cmake --build --preset lint

  macos-gcc-release:
    runs-on: macos-14
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-macos-universal.tar.gz
      CMAKE_SHA256: 0bb18f295e52d7e9309980e361e79e76a1d8da67a1587255cbe3696ea998f597
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
      NINJA_SHA256: c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | shasum -a 256 -c
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | shasum -a 256 -c
          unzip -o /tmp/ninja.zip -d /tmp
          sudo mv /tmp/ninja /usr/local/bin/ninja
          chmod +x /usr/local/bin/ninja
          cmake --version
          ninja --version
      - name: Require pinned GCC 16
        run: |
          if ! command -v g++-16 >/dev/null; then
            brew install gcc@16
          fi
          g++-16 --version
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  macos-gcc-asan-ubsan:
    runs-on: macos-14
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-macos-universal.tar.gz
      CMAKE_SHA256: 0bb18f295e52d7e9309980e361e79e76a1d8da67a1587255cbe3696ea998f597
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
      NINJA_SHA256: c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake and Ninja
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | shasum -a 256 -c
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | shasum -a 256 -c
          unzip -o /tmp/ninja.zip -d /tmp
          sudo mv /tmp/ninja /usr/local/bin/ninja
          chmod +x /usr/local/bin/ninja
      - name: Require pinned GCC 16
        run: |
          if ! command -v g++-16 >/dev/null; then
            brew install gcc@16
          fi
      - name: Configure
        run: cmake --preset asan-ubsan
      - name: Build
        run: cmake --build --preset asan-ubsan
      - name: Test
        run: ctest --preset asan-ubsan

  macos-lint:
    runs-on: macos-14
    env:
      CMAKE_URL: https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-macos-universal.tar.gz
      CMAKE_SHA256: 0bb18f295e52d7e9309980e361e79e76a1d8da67a1587255cbe3696ea998f597
      NINJA_URL: https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-mac.zip
      NINJA_SHA256: c99048673aa765960a99cf10c6ddb9f1fad506099ff0a0e137ad8960a88f321b
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned CMake, Ninja, and LLVM 22
        run: |
          curl -fsSL -o /tmp/cmake.tar.gz "$CMAKE_URL"
          echo "$CMAKE_SHA256  /tmp/cmake.tar.gz" | shasum -a 256 -c
          sudo tar -C /usr/local --strip-components=1 -xzf /tmp/cmake.tar.gz
          curl -fsSL -o /tmp/ninja.zip "$NINJA_URL"
          echo "$NINJA_SHA256  /tmp/ninja.zip" | shasum -a 256 -c
          unzip -o /tmp/ninja.zip -d /tmp
          sudo mv /tmp/ninja /usr/local/bin/ninja
          chmod +x /usr/local/bin/ninja
          brew install llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Configure
        run: |
          LLVM="$(brew --prefix llvm@22)"
          cmake --preset lint \
            -DCMAKE_CXX_COMPILER="$LLVM/bin/clang++" \
            -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS="$LLVM/bin/clang-scan-deps" \
            -DCMAKE_CXX_CLANG_TIDY="$LLVM/bin/clang-tidy;--experimental-custom-checks"
      - name: Build
        run: cmake --build --preset lint
